interface:
  display_name: "LightRAG Agentic Development"
  short_description: "Route source-grounded LightRAG project queries"
  brand_color: "#2563EB"
  default_prompt: "Use $lightrag-agentic-development to choose the right LightRAG query tool and retrieve source-grounded project knowledge."
dependencies:
  tools:
    - type: "mcp"
      value: "lightrag"
      description: "LightRAG MCP server for source-grounded project queries and memory maintenance"
      transport: "streamable_http"
      url: "https://rag.urm8.org/mcp"
policy:
  allow_implicit_invocation: true
