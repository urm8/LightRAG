interface:
  display_name: "LightRAG Agentic Development"
  short_description: "Use LightRAG as project memory"
  brand_color: "#2563EB"
  default_prompt: "Use $lightrag-agentic-development to query project memory, anchor findings to the current Project entity, and save durable workflow notes."
dependencies:
  tools:
    - type: "mcp"
      value: "lightrag"
      description: "Local LightRAG MCP server for project memory queries and durable notes"
      transport: "streamable_http"
      url: "http://127.0.0.1:9621/mcp"
policy:
  allow_implicit_invocation: true
