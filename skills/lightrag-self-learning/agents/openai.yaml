interface:
  display_name: "LightRAG Self-Learning"
  short_description: "Recognize, capture, and reuse verified workflows"
  brand_color: "#2563EB"
  default_prompt: "Use $lightrag-self-learning to reuse an existing workflow or capture the verified golden path from this task."
dependencies:
  tools:
    - type: "mcp"
      value: "lightrag"
      description: "LightRAG MCP server used as shared reusable memory"
      transport: "streamable_http"
      url: "https://rag.urm8.org/mcp"
policy:
  allow_implicit_invocation: true
