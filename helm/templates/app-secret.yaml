{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.appSecretName }}
  labels:
    {{- include "lightrag.labels" . | nindent 4 }}
type: Opaque
stringData:
  LLM_BINDING_API_KEY: {{ required "secrets.llmApiKey is required when secrets.create=true" .Values.secrets.llmApiKey | quote }}
  EMBEDDING_BINDING_API_KEY: {{ required "secrets.embeddingApiKey is required when secrets.create=true" .Values.secrets.embeddingApiKey | quote }}
  LIGHTRAG_API_KEY: {{ required "secrets.lightragApiKey is required when secrets.create=true" .Values.secrets.lightragApiKey | quote }}
{{- end }}
